<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The colony</title>
<style>
  :root {
    --bg:#070b16; --bg2:#0b1222; --panel:#0e1628; --line:#1c2a44; --fg:#e9eef7; --dim:#8a98b3;
    --amber:#ffb454; --mint:#5fd7a7;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--fg);
    background: radial-gradient(1200px 700px at 15% -10%, #12204099, transparent 70%),
                radial-gradient(900px 600px at 110% 110%, #0f2a2a66, transparent 70%), var(--bg);
    background-attachment: fixed;
    font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .head { display:flex; align-items:baseline; gap:14px; padding:10px 18px 8px; border-bottom:1px solid var(--line); }
  .head h1 { font-size:17px; margin:0; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); font-weight:700; }
  .head .grp { font-size:17px; color:var(--fg); font-weight:600; }
  .head .n { margin-left:auto; color:var(--dim); font-size:13px; }

  /* Tiles grow with their content between MIN and MAX instead of clipping it. */
  main { display:grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap:18px; padding:18px; align-items:start; }
  .k { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; animation: in .5s ease-out; box-shadow: 0 0 0 1px #00000040, 0 10px 30px #00000055; }
  @keyframes in { from { opacity:0; transform:scale(.97);} to { opacity:1; transform:none;} }

  /* Hero: same height on every tile, the image is cropped. No image: the same shape with a neutral pattern. */
  .hero { position:relative; height:120px; flex:none; overflow:hidden; background:
      radial-gradient(60px 60px at 18% 40%, #5fd7a722, transparent 70%),
      radial-gradient(90px 90px at 62% 70%, #7cc4ff1c, transparent 70%),
      radial-gradient(44px 44px at 84% 28%, #ffb4541f, transparent 70%),
      linear-gradient(135deg, #0f1a30, #0a1324); }
  .hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, #07091400 35%, #070b16dd 100%); pointer-events:none; }
  .hero .name { position:absolute; left:14px; bottom:9px; z-index:1; font-size:21px; font-weight:700; letter-spacing:.02em; text-shadow:0 1px 8px #000; }
  .hero .name small { display:block; font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; opacity:.85; }
  .hero .tools { position:absolute; right:8px; top:8px; z-index:1; display:flex; gap:4px; }
  .hero .tools a, .hero .tools button { color:#d9e2f0; background:#070b16b0; border:1px solid #ffffff1f; font:inherit; font-size:12px; cursor:pointer; text-decoration:none; padding:3px 8px; border-radius:7px; backdrop-filter: blur(4px); }
  .hero .tools a:hover, .hero .tools button:hover { color:#fff; border-color:#ffffff55; }
  .k iframe { width:100%; height:340px; border:0; background:var(--bg); display:block; }
  /* The group's own app (<meta name="colony" content="group-app">): first in its group, full width, taller. */
  .k.app { grid-column:1/-1; border-color:var(--amber, #ffb454); box-shadow:0 0 0 1px #ffb45466, 0 14px 40px #00000066; }
  .k.app .hero { height:150px; }
  .k.app iframe { min-height:620px; }
  .k .badge { display:inline-block; margin-left:10px; padding:2px 9px; border-radius:999px; background:#ffb454; color:#111; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; vertical-align:middle; text-shadow:none; }

  /* Fullscreen for the demo: covers the whole window, Esc or the same button closes it. */
  .k.stor { position:fixed; inset:0; z-index:50; border-radius:0; border:0; }
  .k.stor .hero { height:48px; }
  .k.stor .hero .name { bottom:12px; font-size:18px; }
  .k.stor iframe { height:100% !important; flex:1; }
  .tom { color:var(--dim); padding:64px 16px; text-align:center; grid-column:1/-1; font-size:17px; }
  .tom b { color:var(--fg); display:block; font-size:22px; margin-bottom:8px; }
  @media (min-width: 1700px) { main { grid-template-columns: repeat(3, 1fr); } }
  @media (prefers-reduced-motion: reduce) { .k { animation:none; } }
</style>
</head>
<body>
<nav id="nav"></nav>
<div class="head"><h1>The colony</h1><span class="grp" id="grp"></span><span class="n" id="n"></span></div>
<main id="m"></main>
<script src="/nav.js" defer></script>
<script>
// The big screen: one tile per team, as they lie in public/colony/<team>/.
// On the hub (the Plenary Square) the page shows every group's tiles instead: it asks /api/hub/grupper for the
// groups and each group's own /api/tiles (both answer with CORS), and the tiles load from the group's address.
// The page knows nothing about what the group decided to build. Anything that ties the tiles
// together (a pulse strip, a score, lines between tiles) is the teams' to build, on purpose.
const seen = new Map();           // team -> card
const MIN = 340, MAX = 720;       // the tile's height follows its content between these limits
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

// /api/tiles returns a list. Each entry is either a string ("team/" or "team.html", the old format)
// or an object with team and hero. Both are accepted, so the page survives the server and the page
// being updated at different times.
function tolka(x) {
  if (typeof x === 'string') {
    const team = x.replace(/\.html$|\/$/, '');
    return { team, url: '/colony/' + encodeURIComponent(team) + (x.endsWith('.html') ? '.html' : '/'), hero: null, app: false };
  }
  const team = String(x.team || x.name || x.namn || '').replace(/\.html$|\/$/, '');
  const fil = String(x.fil || x.file || '');
  const url = x.url || ('/colony/' + encodeURIComponent(team) + (fil.endsWith('.html') ? '.html' : '/'));
  return { team, url, hero: x.hero || null, app: !!x.group_app };
}

function kort(t) {
  const d = document.createElement('section'); d.className = t.app ? 'k app' : 'k'; d.dataset.team = t.team;
  // allow-forms: without it, submit in the tiles' own forms is swallowed silently and teams rebuild
  // their buttons for nothing. That cost a whole morning once.
  d.innerHTML = '<div class="hero"><span class="name">' + (t.grupp ? '<small>' + esc(t.grupp) + '</small>' : '') + esc(t.team) + (t.app ? '<span class="badge">Group app</span>' : '') + '</span><span class="tools">'
    + '<a href="' + esc(t.backend || '/t/' + encodeURIComponent(t.team) + '/') + '" target="_blank" title="the team\'s backend">backend</a>'
    + '<a href="' + esc(t.url) + '" target="_blank" title="open in a new tab">open</a>'
    + '<button title="fullscreen (Esc closes)">fullscreen</button></span></div>'
    + '<iframe src="' + esc(t.url) + '" sandbox="allow-scripts allow-same-origin allow-forms" loading="lazy"></iframe>';
  d.querySelector('button').onclick = () => stor(d);
  hero(d, t.hero);
  return d;
}
// The hero image may arrive long after the tile went live. Swapped only when its address changes.
function hero(d, src) {
  const box = d.querySelector('.hero');
  const old = box.querySelector('img');
  if ((old ? old.dataset.src : null) === (src || null)) return;
  if (old) old.remove();
  if (!src) return;
  const img = new Image(); img.alt = ''; img.dataset.src = src; img.decoding = 'async';
  img.onerror = () => img.remove();   // broken image: the placeholder shows instead
  img.src = src;
  box.insertBefore(img, box.firstChild);
}
function stor(d) {
  const pa = !d.classList.contains('stor');
  document.querySelectorAll('.k.stor').forEach(x => { x.classList.remove('stor'); x.querySelector('button').textContent = 'fullscreen'; });
  d.classList.toggle('stor', pa); d.querySelector('button').textContent = pa ? 'close' : 'fullscreen';
  document.body.style.overflow = pa ? 'hidden' : '';
}
addEventListener('keydown', e => { if (e.key === 'Escape') { document.querySelectorAll('.k.stor').forEach(x => stor(x)); document.body.style.overflow = ''; } });

// Let the tile grow with its content. Same origin, so we may read the iframe's height.
// Tip for teams: do not lock body to height:100vh with overflow:hidden. Then it only reports the
// tile's own height, and the tile never grows past MIN.
function passa() {
  for (const d of seen.values()) {
    if (d.classList.contains('stor')) continue;
    const f = d.querySelector('iframe');
    try {
      const doc = f.contentDocument; if (!doc || !doc.body) continue;
      let h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
      for (const el of doc.querySelectorAll('*')) if (el.scrollHeight > el.clientHeight + 4 && el.clientHeight > 40) h = Math.max(h, f.clientHeight + (el.scrollHeight - el.clientHeight));
      const mal = Math.max(MIN, Math.min(MAX, Math.ceil(h)));
      if (Math.abs(mal - f.clientHeight) > 6) f.style.height = mal + 'px';
    } catch {}
  }
}
setInterval(passa, 1500);

async function hamta() {
  // /api/kvarter is the old name; the server keeps it as an alias.
  for (const u of ['/api/tiles', '/api/kvarter']) {
    try { const r = await fetch(u); if (r.ok) { const j = await r.json(); return Array.isArray(j) ? j : (j.tiles || []); } } catch {}
  }
  return null;
}
// The hub: every group's tiles. A group that does not answer keeps the tiles already shown.
async function hamtaHubb() {
  const grupper = await fetch('/api/hub/grupper').then(r => (r.ok ? r.json() : null)).catch(() => null);
  if (!Array.isArray(grupper)) return null;
  const ut = [];
  await Promise.all(grupper.map(async g => {
    const bas = String((g && g.url) || '').replace(/\/+$/, '');
    if (!/^https?:\/\//.test(bas)) return;
    const raw = await fetch(bas + '/api/tiles').then(r => (r.ok ? r.json() : null)).catch(() => null);
    if (!Array.isArray(raw)) return;
    for (const t of raw.map(tolka).filter(t => t.team)) {
      ut.push({ team: t.team, app: t.app, grupp: g.namn || g.id, key: g.id + '/' + t.team, sort: (g.namn || g.id) + '\u0000' + (t.app ? '0' : '1') + t.team,
        url: bas + t.url, hero: t.hero ? bas + t.hero : null, backend: bas + '/t/' + encodeURIComponent(t.team) + '/' });
    }
  }));
  return ut;
}
let pahubb = null;                   // null until /api/health has answered once
async function load() {
  if (pahubb === null) { const h = await fetch('/api/health').then(r => r.json()).catch(() => null); if (!h) return; pahubb = !!h.hub; }
  let list;
  if (pahubb) { list = await hamtaHubb(); if (!list) return; }
  else {
    const raw = await hamta();
    if (!raw) return;                // the server is not answering right now: keep what is shown
    list = raw.map(tolka).filter(t => t.team).map(t => ({ ...t, key: t.team, sort: (t.app ? '0' : '1') + t.team }));
  }
  const m = document.getElementById('m');
  list.sort((a, b) => a.sort.localeCompare(b.sort, 'en'));
  if (list.length) { const t = m.querySelector('.tom'); if (t) t.remove(); }
  for (const t of list) {
    // a tile that became (or stopped being) the group's app is rebuilt in its new place
    if (seen.has(t.key) && seen.get(t.key).classList.contains('app') !== !!t.app) { seen.get(t.key).remove(); seen.delete(t.key); }
    if (seen.has(t.key)) { hero(seen.get(t.key), t.hero); continue; }
    const d = kort(t); d.dataset.sort = t.sort; seen.set(t.key, d);
    // keep the order (group, then team) when new tiles arrive
    const fore = [...seen.values()].filter(x => x.isConnected && x.dataset.sort.localeCompare(t.sort, 'en') > 0)
      .sort((a, b) => a.dataset.sort.localeCompare(b.dataset.sort, 'en'))[0];
    m.insertBefore(d, fore || null);
  }
  const n = seen.size;
  document.getElementById('n').textContent = n + (n === 1 ? ' tile' : ' tiles') + (pahubb ? ' in all groups' : '');
  if (!n && !m.querySelector('.tom')) m.innerHTML = pahubb
    ? '<div class="tom"><b>No tiles yet.</b>The tiles from every group show up here as the teams deliver.</div>'
    : '<div class="tom"><b>No tiles yet.</b>Each team gets a tile here when its first pull request is merged: board/public/colony/&lt;your-team-name&gt;/index.html.</div>';
}
load(); setInterval(load, 20000);

// After a deploy the tiles have new code but the iframes still hold the old one. The server changes
// `startad` on every restart: then the page reloads, so the big screen never shows a stale colony.
let startad;
async function halsa() {
  const h = await fetch('/api/health').then(r => r.json()).catch(() => null);
  if (!h) return;
  document.getElementById('grp').textContent = h.grupp_namn || '';
  if (h.grupp_namn) document.title = 'The colony · ' + h.grupp_namn;
  if (!h.startad) return;
  if (startad && h.startad !== startad && !document.querySelector('.k.stor')) location.reload();
  startad = startad || h.startad;
}
halsa(); setInterval(halsa, 15000);
</script>
</body>
</html>
