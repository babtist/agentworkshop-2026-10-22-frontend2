<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commuter-train delays</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Pendeltåg delays</h1>
    <form id="pick" autocomplete="off">
      <label>Display <input id="displayId" pattern="[A-Za-z0-9_-]{1,40}" maxlength="40" required></label>
      <button>Show</button>
    </form>
  </header>

  <section id="card" class="lvl-unknown" aria-live="polite">
    <div id="level">…</div>
    <div id="summary">Connecting to the controller…</div>
    <div class="stats">
      <div><b id="lateCount">–</b><span>late</span></div>
      <div><b id="canceledCount">–</b><span>canceled</span></div>
      <div><b id="maxDelay">–</b><span>max delay (min)</span></div>
      <div><b id="tracked">–</b><span>trains tracked</span></div>
    </div>
    <div id="notice" hidden></div>
    <div id="meta"></div>
  </section>

  <details id="settings">
    <summary>Thresholds for this display</summary>
    <form id="thresholds">
      <label>Warn when at least <input id="trains" type="number" min="1" max="100" required> trains</label>
      <label>are at least <input id="minutes" type="number" min="1" max="240" required> minutes late</label>
      <button>Save</button>
      <span id="saveMsg"></span>
    </form>
    <p class="hint">Severe at twice that many trains. Each display keeps its own thresholds.
      Open another display with <code>?displayId=name</code>.</p>
  </details>
</main>
<script src="app.js"></script>
</body></html>
