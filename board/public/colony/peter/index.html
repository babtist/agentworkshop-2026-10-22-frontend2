<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commuter-train delays</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Pendeltåg delays</h1>
    <form id="pick" autocomplete="off">
      <label>Displays <input id="displayIds" placeholder="hall-1,hall-2" maxlength="500" required
        title="One display id, or several separated by commas for a wall overview"></label>
      <button>Show</button>
      <a id="kioskLink" href="?kiosk=1" title="Full-screen view without controls">Kiosk</a>
    </form>
  </header>

  <div id="grid"></div>

  <section id="mapSection">
    <div id="map" role="region" aria-label="Map of commuter stations coloured by delay level"></div>
    <div id="mapNote" class="map-note">Loading stations…</div>
  </section>

  <details id="settings">
    <summary>Thresholds for display <b id="settingsFor"></b></summary>
    <form id="thresholds">
      <label>Warn when at least <input id="trains" type="number" min="1" max="100" required> trains</label>
      <label>are at least <input id="minutes" type="number" min="1" max="240" required> minutes late</label>
      <button>Save</button>
      <span id="saveMsg"></span>
    </form>
    <p class="hint">Severe at twice that many trains. Each display keeps its own thresholds.
      One display: <code>?displayId=hall-1</code>. Wall overview: <code>?displays=hall-1,hall-2</code>.
      Add <code>&amp;kiosk=1</code> for a screen without controls.</p>
  </details>
</main>
<script src="app.js"></script>
<script src="risk.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="map.js"></script>
</body></html>
