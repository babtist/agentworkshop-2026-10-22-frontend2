<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Departures · FrontEnd 2</title>
  <link rel="stylesheet" href="departures.css">
</head>
<body>
  <main class="sign" id="sign">
    <header class="sign-head">
      <button class="sign-station" id="station" type="button" title="Change station">…</button>
      <div class="sign-clock" id="clock">--:--</div>
    </header>
    <div class="sign-cols" aria-hidden="true"><span>Time</span><span class="h-track">Track</span><span>Train</span><span>To</span><span>Departs</span></div>
    <div class="sign-notice" id="notice" hidden></div>
    <ol class="sign-rows" id="rows" aria-live="polite"></ol>
    <footer class="sign-foot">
      <div class="ticker"><span id="ticker"></span></div>
    </footer>
  </main>

  <dialog id="picker">
    <form method="dialog" id="pickForm">
      <label for="pick">Choose a station</label>
      <input id="pick" list="pickList" autocomplete="off" placeholder="e.g. Odenplan">
      <datalist id="pickList"></datalist>
      <p class="pick-miss" id="pickMiss" hidden>No station by that name.</p>
      <div class="pick-row"><button value="ok">Show departures</button> <a href="./">Back to map</a></div>
    </form>
  </dialog>
  <script src="departures.js"></script>
</body>
</html>
