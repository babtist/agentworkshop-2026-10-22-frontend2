<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Train delays (babtist)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;min-height:320px;background:#070b16;color:#e9eef7;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:420px;margin:0 auto;padding:16px;text-align:center}
  h1{color:#ffb454;font-size:16px;margin:0 0 12px;letter-spacing:.14em;text-transform:uppercase}
  #light{width:140px;height:140px;border-radius:50%;margin:8px auto;display:grid;place-items:center;font-size:20px;font-weight:700;text-transform:uppercase;background:#3a4258;color:#fff;transition:background .3s,box-shadow .3s}
  #light.ok{background:#1f9d6b;box-shadow:0 0 36px #1f9d6b88}
  #light.warning{background:#d99a1b;box-shadow:0 0 36px #d99a1b88}
  #light.severe{background:#d8423a;box-shadow:0 0 36px #d8423a88}
  #sum{margin:6px 0 2px;font-size:17px}
  .dim{color:#8a98b3;font-size:13px}
  #note{color:#ffb454;font-size:13px;min-height:18px}
  form{margin-top:14px;display:flex;gap:8px;justify-content:center;align-items:end;flex-wrap:wrap}
  label{display:grid;gap:2px;font-size:12px;color:#8a98b3;text-align:left}
  input{width:72px;padding:6px;border-radius:6px;border:1px solid #2b3550;background:#0f1730;color:#e9eef7}
  button{padding:7px 12px;border-radius:6px;border:0;background:#ffb454;color:#1a1200;font-weight:600;cursor:pointer}
</style></head>
<body><main>
  <h1>Commuter train delays</h1>
  <div id="light">…</div>
  <div id="sum">Connecting…</div>
  <div class="dim" id="detail"></div>
  <div id="note"></div>
  <form id="f">
    <label>Warn at X late trains<input id="trains" type="number" min="1" max="100" value="3"></label>
    <label>Late = at least Y min<input id="minutes" type="number" min="1" max="240" value="5"></label>
    <button>Save</button>
  </form>
  <p class="dim">Display: <span id="did"></span></p>
</main>
<script>
// Example presentation for babtist's controller (/t/babtist/). Same origin, no CORS. All text goes in via textContent.
// Use ?display=<id> to give each screen its own thresholds.
const BASE = '/t/babtist/api';
const ID = (new URLSearchParams(location.search).get('display') || 'babtist-demo').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || 'babtist-demo';
const $ = id => document.getElementById(id);
$('did').textContent = ID;

function render(s) {
  const light = $('light');
  light.className = s.level;
  light.textContent = s.level;
  $('sum').textContent = `${s.lateCount} of ${s.trainsTracked} trains late (≥ ${s.thresholds.minutes} min)`;
  $('detail').textContent = `${s.canceledCount} cancelled · worst delay ${s.maxDelayMinutes} min · updated ${new Date(s.updatedAt).toLocaleTimeString()}`;
  $('note').textContent = s.upstream === 'ok' ? '' : s.upstream === 'no-key' ? 'Demo data: server has no Trafikverket key' : 'Trafikverket unreachable: data may be stale';
  if (document.activeElement.tagName !== 'INPUT') { $('trains').value = s.thresholds.trains; $('minutes').value = s.thresholds.minutes; }
}

const poll = () => fetch(`${BASE}/status?displayId=${ID}`).then(r => r.json()).then(render).catch(() => { $('note').textContent = 'Controller unreachable'; });
poll();
let timer = setInterval(poll, 20000);
if (window.EventSource) {
  const es = new EventSource(`${BASE}/stream?displayId=${ID}`);
  es.addEventListener('status', e => { clearInterval(timer); timer = null; render(JSON.parse(e.data)); });
  es.onerror = () => { if (!timer) timer = setInterval(poll, 20000); };
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const body = JSON.stringify({ trains: Number($('trains').value), minutes: Number($('minutes').value) });
  const r = await fetch(`${BASE}/displays/${ID}`, { method: 'PUT', body });
  if (!r.ok) { $('note').textContent = (await r.json()).error; return; }
  poll();
});
</script></body></html>
